<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nueva Habitación - Royal Sayariy Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link th:href="@{/css/admin-flujo-caja.css}" rel="stylesheet">
    <style>
        .form-card {
            background: white;
            border-radius: 22px;
            padding: 34px;
            border: 1px solid #eee7e2;
            box-shadow: 0 4px 18px rgba(0, 0, 0, 0.04);
        }
        .form-card h5 {
            font-weight: 700;
            color: var(--chalet-text);
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .form-card h5 i { color: var(--chalet-brown); }
        .form-label-custom {
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--chalet-text);
            margin-bottom: 6px;
        }
        .form-control-custom, .form-select-custom {
            border-radius: 12px;
            border: 1px solid #e5e0db;
            padding: 10px 14px;
            font-size: 0.95rem;
            transition: 0.2s;
        }
        .form-control-custom:focus, .form-select-custom:focus {
            border-color: var(--chalet-brown);
            box-shadow: 0 0 0 3px rgba(126, 99, 84, 0.1);
        }
        .btn-submit {
            background: var(--chalet-brown) !important;
            color: white !important;
            border-radius: 14px !important;
            padding: 12px 32px !important;
            font-weight: 700 !important;
            border: none !important;
            transition: 0.25s !important;
        }
        .btn-submit:hover { background: var(--chalet-hover) !important; transform: translateY(-2px); }
        .btn-cancel {
            background: white !important;
            color: var(--chalet-text) !important;
            border-radius: 14px !important;
            padding: 12px 32px !important;
            font-weight: 600 !important;
            border: 1px solid #e5e0db !important;
            text-decoration: none !important;
            transition: 0.25s !important;
        }
        .btn-cancel:hover { background: #f8f5f2 !important; }
        .switch-label {
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            padding: 10px 16px;
            border-radius: 12px;
            background: var(--soft-beige);
            font-weight: 600;
            font-size: 0.9rem;
            color: var(--chalet-text);
        }
        .switch-label input { width: 18px; height: 18px; accent-color: var(--chalet-brown); }
        .img-preview {
            width: 100%;
            max-height: 220px;
            object-fit: cover;
            border-radius: 14px;
            border: 1px solid #e5e0db;
            display: none;
        }
    </style>
</head>
<body>

<aside class="sidebar">
    <div class="brand">
        <h2>Royal Sayariy</h2>
        <span>Panel administrativo</span>
    </div>
    <div class="menu">
        <a th:href="@{/admin/dashboard}"><i class="bi bi-grid-fill"></i> Dashboard</a>
        <a th:href="@{/admin/reservas}"><i class="bi bi-calendar-check-fill"></i> Reservas</a>
        <a th:href="@{/admin/habitaciones}" class="active"><i class="bi bi-door-open-fill"></i> Habitaciones</a>
        <a th:href="@{/admin/clientes}"><i class="bi bi-people-fill"></i> Clientes</a>
        <a th:href="@{/admin/flujo-caja}"><i class="bi bi-cash-coin"></i> Flujo de Caja</a>
    </div>
    <div class="logout">
        <a th:href="@{/logout}"><i class="bi bi-box-arrow-left"></i> Cerrar Sesión</a>
    </div>
</aside>

<main class="main-content">

    <section class="hero-section">
        <div class="hero-content">
            <h1 class="hero-title">Nueva Habitación</h1>
            <p class="hero-subtitle">Registra una nueva habitación en el sistema.</p>
        </div>
    </section>

    <form th:action="@{/admin/habitacion/crear}" method="post" enctype="multipart/form-data" class="row g-4">

        <div class="col-lg-8">

            <div class="form-card mb-4">
                <h5><i class="bi bi-door-open-fill"></i> Información de la Habitación</h5>

                <div class="mb-3">
                    <label class="form-label-custom">Tipo de habitación</label>
                    <select name="tipo" class="form-select form-select-custom" required>
                        <option value="">— Seleccione un tipo —</option>
                        <option value="Simple">Simple</option>
                        <option value="Doble">Doble</option>
                        <option value="Suite">Suite</option>
                        <option value="Suite Premium">Suite Premium</option>
                        <option value="Familiar">Familiar</option>
                        <option value="Matrimonial">Matrimonial</option>
                    </select>
                </div>

                <div class="mb-3">
                    <label class="form-label-custom">Precio por noche (S/)</label>
                    <input type="number" name="precio" class="form-control form-control-custom"
                           step="0.01" min="0" placeholder="0.00" required>
                </div>

                <div class="mb-3">
                    <label class="form-label-custom">Descripción</label>
                    <textarea name="descripcion" class="form-control form-control-custom"
                              rows="4" placeholder="Descripción de la habitación..."></textarea>
                </div>

                <div class="mb-3">
                    <label class="switch-label" style="width:fit-content;">
                        <input type="hidden" name="disponible" id="disponibleField" value="true">
                        <input type="checkbox" checked
                               onchange="document.getElementById('disponibleField').value=this.checked?'true':'false'">
                        Habitación disponible
                    </label>
                </div>
            </div>

        </div>

        <div class="col-lg-4">

            <div class="form-card mb-4">
                <h5><i class="bi bi-image-fill"></i> Imagen</h5>
                <label class="form-label-custom">Subir imagen de la habitación</label>
                <input type="file" name="imagen" class="form-control form-control-custom"
                       accept="image/*" onchange="previewImagen(event)">
                <img id="imgPreview" class="img-preview mt-3">
            </div>

            <div class="d-flex gap-3">
                <button type="submit" class="btn btn-submit flex-fill">
                    <i class="bi bi-check-circle-fill me-1"></i> Crear Habitación
                </button>
                <a th:href="@{/admin/habitaciones}" class="btn btn-cancel">
                    <i class="bi bi-x-circle me-1"></i> Cancelar
                </a>
            </div>

        </div>
    </form>

</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
function previewImagen(event) {
    const img = document.getElementById('imgPreview');
    const file = event.target.files[0];
    if (file) {
        const reader = new FileReader();
        reader.onload = function(e) {
            img.src = e.target.result;
            img.style.display = 'block';
        };
        reader.readAsDataURL(file);
    } else {
        img.style.display = 'none';
    }
}
</script>
</body>
</html>
