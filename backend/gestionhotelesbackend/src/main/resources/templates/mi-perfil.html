<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Perfil - GestionHoteles</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link th:href="@{/css/navbar.css}" rel="stylesheet">
    <link th:href="@{/css/mi-perfil.css}" rel="stylesheet">
</head>
<body class="d-flex flex-column min-vh-100">

    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <main class="container py-4">
       

        <div class="row g-4">

            <div class="col-lg-6">

                <div class="card profile-card">
                    <div class="card-body p-4">

                        <h5 class="card-title fw-bold mb-3">
                            <i class="bi bi-person-fill me-2" style="color:var(--chalet-brown);"></i>
                            Informaci&oacute;n Personal
                        </h5>

                        <div class="alert alert-success alert-dismissible fade show" role="alert"
                             th:if="${success != null}">
                            <i class="bi bi-check-circle-fill me-1"></i> <span th:text="${success}"></span>
                            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                        </div>

                        <div class="alert alert-danger alert-dismissible fade show" role="alert"
                             th:if="${error != null}">
                            <i class="bi bi-exclamation-triangle-fill me-1"></i> <span th:text="${error}"></span>
                            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                        </div>

                        <form th:action="@{/mi-perfil/actualizar}" method="post">

                            <div class="mb-3">
                                <label for="nombre" class="form-label">Nombre Completo</label>
                                <input type="text" id="nombre" name="nombre"
                                       class="form-control form-control-lg"
                                       th:value="${usuario.nombre}"
                                       placeholder="Su nombre"
                                       required>
                            </div>

                            <div class="mb-3">
                                <label for="email" class="form-label">Correo Electr&oacute;nico</label>
                                <input type="email" id="email" name="email"
                                       class="form-control form-control-lg"
                                       th:value="${usuario.email}"
                                       placeholder="correo@ejemplo.com"
                                       required>
                            </div>

                            <div class="mb-3">
                                <label for="telefono" class="form-label">Tel&eacute;fono</label>
                                <input type="tel" id="telefono" name="telefono"
                                       class="form-control form-control-lg"
                                       th:value="${usuario.telefono}"
                                       placeholder="999888777"
                                       maxlength="9">
                            </div>

                            <button type="submit" class="btn btn-primary w-100 btn-lg">
                                <i class="bi bi-check-lg me-1"></i> Guardar Cambios
                            </button>

                        </form>

                    </div>
                </div>

            </div>

            <div class="col-lg-6">

                <div class="card profile-card">
                    <div class="card-body p-4">

                        <h5 class="card-title fw-bold mb-3">
                            <i class="bi bi-lock-fill me-2" style="color:var(--chalet-brown);"></i>
                            Cambiar Contrase&ntilde;a
                        </h5>

                        <div class="alert alert-success alert-dismissible fade show" role="alert"
                             th:if="${successPassword != null}">
                            <i class="bi bi-check-circle-fill me-1"></i> <span th:text="${successPassword}"></span>
                            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                        </div>

                        <div class="alert alert-danger alert-dismissible fade show" role="alert"
                             th:if="${errorPassword != null}">
                            <i class="bi bi-exclamation-triangle-fill me-1"></i> <span th:text="${errorPassword}"></span>
                            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                        </div>

                        <form th:action="@{/mi-perfil/cambiar-password}" method="post">

                            <div class="mb-3">
                                <label for="currentPassword" class="form-label">Contrase&ntilde;a Actual</label>
                                <div class="position-relative">
                                    <input type="password" id="currentPassword" name="currentPassword"
                                           class="form-control form-control-lg pe-5"
                                           placeholder="Ingrese su contrase&ntilde;a actual"
                                           required>
                                    <button type="button" class="toggle-password" onclick="togglePass('currentPassword', this)">
                                        <i class="bi bi-eye"></i>
                                    </button>
                                </div>
                            </div>

                            <div class="mb-3">
                                <label for="newPassword" class="form-label">Nueva Contrase&ntilde;a</label>
                                <div class="position-relative">
                                    <input type="password" id="newPassword" name="newPassword"
                                           class="form-control form-control-lg pe-5"
                                           minlength="6"
                                           placeholder="M&iacute;nimo 6 caracteres"
                                           required>
                                    <button type="button" class="toggle-password" onclick="togglePass('newPassword', this)">
                                        <i class="bi bi-eye"></i>
                                    </button>
                                </div>
                            </div>

                            <div class="mb-3">
                                <label for="confirmPassword" class="form-label">Confirmar Nueva Contrase&ntilde;a</label>
                                <div class="position-relative">
                                    <input type="password" id="confirmPassword" name="confirmPassword"
                                           class="form-control form-control-lg pe-5"
                                           placeholder="Repita la nueva contrase&ntilde;a"
                                           required>
                                    <button type="button" class="toggle-password" onclick="togglePass('confirmPassword', this)">
                                        <i class="bi bi-eye"></i>
                                    </button>
                                </div>
                            </div>

                            <button type="submit" class="btn btn-warning w-100 btn-lg text-white fw-bold">
                                <i class="bi bi-shield-check me-1"></i> Cambiar Contrase&ntilde;a
                            </button>

                        </form>

                    </div>
                </div>

            </div>

        </div>

        <div class="text-center mt-4">
            <a th:href="@{/mis-reservas}" class="btn btn-outline-secondary btn-lg">
                <i class="bi bi-arrow-left me-1"></i> Volver a Mis Reservas
            </a>
        </div>

    </main>

    

    <script>
    function togglePass(id, btn) {
        var i = document.getElementById(id);
        var icon = btn.querySelector('i');
        if (i.type === 'password') {
            i.type = 'text';
            icon.className = 'bi bi-eye-slash';
        } else {
            i.type = 'password';
            icon.className = 'bi bi-eye';
        }
    }
    </script>
    <script th:inline="javascript">
    document.addEventListener('DOMContentLoaded', function() {
        var newPass = document.getElementById('newPassword');
        var confirmPass = document.getElementById('confirmPassword');

        if (newPass && confirmPass) {
            confirmPass.addEventListener('input', function() {
                if (confirmPass.value.length > 0 && confirmPass.value !== newPass.value) {
                    confirmPass.setCustomValidity('Las contrase&ntilde;as no coinciden');
                } else {
                    confirmPass.setCustomValidity('');
                }
            });
            newPass.addEventListener('input', function() {
                if (confirmPass.value.length > 0 && confirmPass.value !== newPass.value) {
                    confirmPass.setCustomValidity('Las contrase&ntilde;as no coinciden');
                } else {
                    confirmPass.setCustomValidity('');
                }
            });
        }
    });
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
