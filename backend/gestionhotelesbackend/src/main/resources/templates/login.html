<!DOCTYPE html>
<!--
  xmlns:th="http://www.thymeleaf.org"
  → Habilita el procesamiento de todas las directivas "th:*"
    en este documento HTML.
-->
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - GestionHoteles</title>

    <!-- Bootstrap CSS (CDN) -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <!-- Bootstrap Icons (CDN) → íconos vectoriales para el menú y formularios -->
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- Google Fonts → Playfair Display e Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">

    <!--
      th:href="@{/css/login.css}"
      → Ruta dinámica al CSS. "@{...}" es la sintaxis de Thymeleaf
        para generar URLs absolutas correctas.
    -->
    <link th:href="@{/css/navbar.css}" rel="stylesheet">
    <link th:href="@{/css/login.css}" rel="stylesheet">
</head>
<body class="d-flex flex-column min-vh-100">

    <!--
      th:replace="~{fragments/navbar :: navbar}"
      → Inserta el fragmento del menú de navegación definido en
        templates/fragments/navbar.html. "~{...}" es la sintaxis
        de Thymeleaf para fragmentos reutilizables.
    -->
    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <main class="container flex-grow-1 d-flex align-items-center justify-content-center py-5">

        <div class="row w-100 justify-content-center">

            <!--
              Columnas responsive:
              col-12 → ocupa todo el ancho en móviles
              col-sm-10 → achica en tablets pequeñas
              col-md-7 → más angosta en tablets
              col-lg-5 → compacta en notebooks
              col-xl-4 → tamaño fijo en pantallas grandes
            -->
            <div class="col-12 col-sm-10 col-md-7 col-lg-5 col-xl-4">

                <div class="card shadow-lg border-0 rounded-4">
                    <div class="card-body p-4 p-md-5">

                        <h3 class="text-center mb-4 fw-bold">
                            Iniciar Sesión
                        </h3>

                        <!-- Mensaje de error de Spring Security -->
                        <div class="alert alert-danger"
                             th:if="${param.error != null}">
                            Email o contraseña incorrectos.
                        </div>

                        <!-- Mensaje de logout exitoso -->
                        <div class="alert alert-success"
                             th:if="${param.logout != null}">
                            Sesión cerrada correctamente.
                        </div>

                        <!--
                          FORMULARIO DE LOGIN
                          Spring Security maneja POST /login automáticamente.
                          Redirige aquí con ?error si falla la autenticación.
                        -->
                        <form th:action="@{/login}" method="post">
                           <!--  <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" /> -->

                            <div class="mb-3">
                                <label for="email" class="form-label">Correo Electrónico</label>
                                <input type="email"
                                       id="email"
                                       name="email"
                                       class="form-control form-control-lg"
                                       placeholder="ejemplo@correo.com"
                                       required>
                            </div>

                            <!--
                              Campo: Contraseña
                              name="password" → debe coincidir con @RequestParam String password
                                en AuthController.procesarLogin().
                              type="password" → oculta los caracteres mientras se escribe.
                            -->
                            <div class="mb-3">
                                <label for="password" class="form-label">Contraseña</label>
                                <div class="position-relative">
                                    <input type="password"
                                           id="password"
                                           name="password"
                                           class="form-control form-control-lg pe-5"
                                           placeholder="Ingrese su contraseña"
                                           required>
                                    <button type="button" class="toggle-password" onclick="togglePass('password', this)">
                                        <i class="bi bi-eye"></i>
                                    </button>
                                </div>
                            </div>

                            <!-- Botón de envío del formulario -->
                            <button type="submit"
                                    class="btn btn-primary w-100 btn-lg mt-2">
                                Ingresar
                            </button>

                            <!--
                              Enlace al registro
                              th:href="@{/registro}"
                              → Redirige a la página de registro (GET).
                                El AuthController muestra el formulario en /registro.
                            -->
                            <p class="text-center text-muted mt-3 mb-0">
                                ¿No tiene cuenta?
                                <a th:href="@{/registro}" class="text-decoration-none">
                                    Regístrese aquí
                                </a>
                            </p>

                        </form>

                    </div>
                </div>

                <!--
                  Datos de prueba (solo para desarrollo)
                  Muestra las credenciales de los usuarios precargados
                  por DataInitializer al iniciar la aplicación.
                  No usa Thymeleaf porque es texto fijo de ayuda.
                -->
                <div class="alert alert-info mt-3 small text-center">
                    <strong> Datos de prueba:</strong><br>
                    Admin: admin@mail.com / admin123<br>
                    Usuario: usuario@mail.com / 123456
                </div>

            </div>

        </div>

    </main>

    <!--
      th:replace="~{fragments/footer :: footer}"
      → Inserta el fragmento del pie de página.
    -->
    <div th:replace="~{fragments/footer :: footer}"></div>

    <script>
    function togglePass(id, btn) {
        var i = document.getElementById(id);
        var icon = btn.querySelector('i');
        if (i.type === 'password') {
            i.type = 'text';
            icon.className = 'bi bi-eye-slash';
        } else {
            i.type = 'password';
            icon.className = 'bi bi-eye';
        }
    }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
