<!DOCTYPE html>
<!--
  xmlns:th="http://www.thymeleaf.org"
  → Habilita el procesamiento de directivas "th:*" en el HTML.
-->
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrarse - GestionHoteles</title>

    <!-- Bootstrap CSS (CDN) -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <!-- Bootstrap Icons (CDN) -->
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">

    <!--
      th:href="@{/css/registro.css}"
      → Ruta dinámica al CSS específico de registro.
        "@{...}" es la sintaxis de Thymeleaf para URLs absolutas.
    -->
    <link th:href="@{/css/navbar.css}" rel="stylesheet">
    <link th:href="@{/css/registro.css}" rel="stylesheet">
</head>
<body class="d-flex flex-column min-vh-100">

    <!--
      th:replace="~{fragments/navbar :: navbar}"
      → Inserta el fragmento del menú de navegación (navbar).
    -->
    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <main class="container flex-grow-1 d-flex align-items-center justify-content-center py-5">

        <div class="row w-100 justify-content-center">

            <!--
              Columnas responsive:
              col-12 → móvil pequeño (ocupa todo)
              col-sm-10 → tablet pequeña
              col-md-8 → tablet grande
              col-lg-6 → desktop
              col-xl-5 → pantallas extra grandes
            -->
            <div class="col-12 col-sm-10 col-md-8 col-lg-6 col-xl-5">

                <div class="card shadow-lg border-0 rounded-4">

                    <div class="card-body p-4 p-md-5">

                        <h3 class="text-center mb-4 fw-bold">
                            Crear Cuenta
                        </h3>

                        <!--
                          Mensaje de error general (ej: error inesperado del servidor)
                        -->
                        <div class="alert alert-danger"
                             th:if="${error != null}"
                             th:text="${error}">
                        </div>

                        <!--
                          FORMULARIO DE REGISTRO
                        -->
                        <form th:action="@{/registro}" method="post">

                            <!-- Nombre -->
                            <div class="mb-3">
                                <label for="nombre" class="form-label">Nombre Completo</label>
                                <input type="text"
                                       id="nombre"
                                       name="nombre"
                                       th:value="${nombre}"
                                       th:class="'form-control form-control-lg' + (${errorNombre} ? ' is-invalid' : '')"
                                       placeholder="Ej: Juan Pérez"
                                       required>
                                <div class="invalid-feedback" th:if="${errorNombre}" th:text="${errorNombre}"></div>
                            </div>

                            <!-- Email -->
                            <div class="mb-3">
                                <label for="email" class="form-label">Correo Electrónico</label>
                                <input type="email"
                                       id="email"
                                       name="email"
                                       th:value="${email}"
                                       th:class="'form-control form-control-lg' + (${errorEmail} ? ' is-invalid' : '')"
                                       placeholder="ejemplo@correo.com"
                                       required>
                                <div class="invalid-feedback" th:if="${errorEmail}" th:text="${errorEmail}"></div>
                            </div>

                            <!-- Teléfono -->
                            <div class="mb-3">
                                <label for="telefono" class="form-label">Teléfono</label>
                                <input type="tel"
                                       id="telefono"
                                       name="telefono"
                                       th:value="${telefono}"
                                       th:class="'form-control form-control-lg' + (${errorTelefono} ? ' is-invalid' : '')"
                                       placeholder="999888777"
                                       maxlength="9">
                                <div class="invalid-feedback" th:if="${errorTelefono}" th:text="${errorTelefono}"></div>
                            </div>

                            <!-- Contraseña -->
                            <div class="mb-3">
                                <label for="password" class="form-label">Contraseña</label>
                                <div class="position-relative">
                                    <input type="password"
                                           id="password"
                                           name="password"
                                           th:class="'form-control form-control-lg pe-5' + (${errorPassword} ? ' is-invalid' : '')"
                                           minlength="6"
                                           placeholder="Mínimo 6 caracteres"
                                           required>
                                    <button type="button" class="toggle-password" onclick="togglePass('password', this)">
                                        <i class="bi bi-eye"> </i>
                                    </button>
                                    <div class="invalid-feedback" th:if="${errorPassword}" th:text="${errorPassword}"></div>
                                </div>
                            </div>

                            <!-- Confirmar Contraseña -->
                            <div class="mb-3">
                                <label for="confirmarPassword" class="form-label">
                                    Confirmar Contraseña
                                </label>
                                <div class="position-relative">
                                    <input type="password"
                                           id="confirmarPassword"
                                           name="confirmarPassword"
                                           th:class="'form-control form-control-lg pe-5' + (${errorConfirmarPassword} ? ' is-invalid' : '')"
                                           placeholder="Repita la contraseña"
                                           required>
                                    <button type="button" class="toggle-password" onclick="togglePass('confirmarPassword', this)">
                                        <i class="bi bi-eye"></i>
                                    </button>
                                    <div class="invalid-feedback" th:if="${errorConfirmarPassword}" th:text="${errorConfirmarPassword}"></div>
                                </div>
                            </div>

                            <!-- Botón de envío -->
                            <button type="submit"
                                    class="btn btn-success w-100 btn-lg mt-2">
                                Crear Cuenta
                            </button>

                            <!--
                              Enlace al login
                              th:href="@{/login}"
                              → Redirige a la página de inicio de sesión.
                            -->
                            <p class="text-center text-muted mt-3 mb-0">
                                ¿Ya tiene cuenta?
                                <a th:href="@{/login}" class="text-decoration-none">
                                    Inicie sesión aquí
                                </a>
                            </p>

                        </form>

                    </div>
                </div>

            </div>

        </div>

    </main>

    <!-- Footer (fragmento) -->
    <div th:replace="~{fragments/footer :: footer}"></div>

    <script>
    function togglePass(id, btn) {
        var i = document.getElementById(id);
        var icon = btn.querySelector('i');
        if (i.type === 'password') {
            i.type = 'text';
            icon.className = 'bi bi-eye-slash';
        } else {
            i.type = 'password';
            icon.className = 'bi bi-eye';
        }
    }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
