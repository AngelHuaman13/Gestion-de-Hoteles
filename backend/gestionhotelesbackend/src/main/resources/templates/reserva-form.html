<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reservar - GestionHoteles</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link th:href="@{/css/navbar.css}" rel="stylesheet">
    <link th:href="@{/css/reserva-form.css}" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/themes/airbnb.css">
</head>
<body class="d-flex flex-column min-vh-100">

    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <main class="container py-4 py-md-5 contenedor">

        <div class="row g-4 justify-content-center">

            <!-- COLUMNA IZQUIERDA: INFO + IMAGEN -->
            <div class="col-12 col-lg-4">

                <div class="card border-0 shadow-sm rounded-4 h-100 overflow-hidden">

                    <div class="hab-img-wrap">
                        <img th:src="@{${habitacion.url}}"
                             alt="Habitación"
                             class="hab-img">
                    </div>

                    <div class="card-body d-flex flex-column">

                        <h4 class="fw-bold mb-2" th:text="${habitacion.tipo}">Suite</h4>
                        <p class="text-muted small flex-grow-1" th:text="${habitacion.descripcion}">
                            Descripción
                        </p>

                        <hr class="my-3">

                        <div class="d-flex justify-content-between align-items-center mb-2">
                            <span class="fw-semibold">Precio por noche</span>
                            <span class="fw-bold fs-5" style="color:var(--chalet-brown);">
                                S/ <span th:text="${habitacion.precio}">0.00</span>
                            </span>
                        </div>

                        <hr class="my-2">

                        <div class="d-flex justify-content-between align-items-center">
                            <span class="fw-semibold">Total estimado</span>
                            <span class="fw-bold fs-4" id="totalDisplay" style="color:var(--chalet-brown);">
                                S/ 0.00
                            </span>
                        </div>
                        <small class="text-muted mt-1" id="nochesDisplay">Selecciona las fechas para ver el total</small>

                    </div>
                </div>

            </div>

            <!-- COLUMNA DERECHA: FORMULARIO -->
            <div class="col-12 col-lg-6">

                <div class="card shadow-lg border-0 rounded-4">
                    <div class="card-body p-4 p-md-5">

                        <h3 class="text-center mb-4 fw-bold">
                             Confirmar Reserva
                        </h3>

                        <form th:action="@{/reserva}" method="post" id="reservaForm">

                            <input type="hidden" name="habitacionId"
                                   th:value="${habitacion.id}">

                            <div class="mb-3">
                                <label class="form-label">Selecciona tus fechas</label>
                                <div class="flatpickr-container">
                                    <i class="bi bi-calendar-range flatpickr-icon"></i>
                                    <input type="text"
                                           id="rangoFechas"
                                           class="form-control form-control-lg flatpickr-input"
                                           placeholder="fecha de entrada → fecha de salida"
                                           readonly="readonly"
                                           required>
                                </div>
                                <div class="form-text mt-1">
                                    <i class="bi bi-info-circle me-1"></i>
                                    Las fechas <span class="text-danger">tachadas en rojo</span> no están disponibles.
                                </div>
                                <input type="hidden" id="fechaInicio" name="fechaInicio">
                                <input type="hidden" id="fechaFin" name="fechaFin">
                            </div>

                            <hr class="my-4">

                            <!-- DATOS DE PAGO CON TARJETA -->
                            <div id="cardPaymentSection">
                                <h5 class="fw-bold mb-3">
                                    <i class="bi bi-credit-card me-2"></i>Datos de Pago
                                </h5>

                                <div class="mb-3">
                                    <label class="form-label">Número de Tarjeta</label>
                                    <input type="text" name="numeroTarjeta" id="numeroTarjeta"
                                           class="form-control form-control-lg"
                                           placeholder="1234 5678 9012 3456"
                                           maxlength="19"
                                           inputmode="numeric">
                                </div>

                                <div class="mb-3">
                                    <label class="form-label">Titular</label>
                                    <input type="text" name="titular" id="titular"
                                           class="form-control form-control-lg"
                                           placeholder="Nombre del titular">
                                </div>

                                <div class="row g-3">
                                    <div class="col-4">
                                        <label class="form-label">Mes</label>
                                        <input type="text" name="mesExpiracion" id="mesExpiracion"
                                               class="form-control form-control-lg"
                                               placeholder="MM" maxlength="2"
                                               inputmode="numeric">
                                    </div>
                                    <div class="col-4">
                                        <label class="form-label">Año</label>
                                        <input type="text" name="anioExpiracion" id="anioExpiracion"
                                               class="form-control form-control-lg"
                                               placeholder="AAAA" maxlength="4"
                                               inputmode="numeric">
                                    </div>
                                    <div class="col-4">
                                        <label class="form-label">CVV</label>
                                        <input type="text" name="cvv" id="cvv"
                                               class="form-control form-control-lg"
                                               placeholder="123" maxlength="4"
                                               inputmode="numeric">
                                    </div>
                                </div>
                            </div>

                            <button type="submit" name="pagoEnHotel" value="false"
                                    class="btn btn-success btn-lg w-100 mt-4">
                                <i class="bi bi-credit-card-fill me-1"></i> Pagar y Confirmar Reserva
                            </button>

                            <button type="submit" name="pagoEnHotel" value="true"
                                    class="btn btn-outline-warning btn-lg w-100 mt-2">
                                <i class="bi bi-shop me-1"></i> Pagar en el hotel
                            </button>

                            <a th:href="@{/habitaciones}"
                               class="btn btn-outline-secondary w-100 mt-2">
                                ← Volver a Habitaciones
                            </a>

                        </form>

                    </div>
                </div>

            </div>

        </div>

    </main>

    <div th:replace="~{fragments/footer :: footer}"></div>

    <div class="modal fade" id="errorModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content" style="border-radius:16px;border:none;box-shadow:0 10px 40px rgba(0,0,0,0.12);">
                <div class="modal-body text-center p-4">
                    <div style="font-size:3rem;color:#dc3545;margin-bottom:12px;">
                        <i class="bi bi-exclamation-circle-fill"></i>
                    </div>
                    <h5 style="font-weight:700;color:#4a4a4a;margin-bottom:8px;">Error de validación</h5>
                    <div id="errorModalList" style="color:#6b7280;margin-bottom:20px;font-size:0.95rem;text-align:left;"></div>
                    <button type="button" class="btn btn-danger" data-bs-dismiss="modal"
                            style="border-radius:14px;padding:10px 28px;font-weight:700;border:none;">
                        Entendido
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.js"></script>

    <script th:inline="javascript">
    function mostrarErrorModal(mensajes) {
        const container = document.getElementById('errorModalList');
        if (typeof mensajes === 'string') {
            container.innerHTML = '<p class="mb-0">' + mensajes + '</p>';
        } else {
            container.innerHTML = '<ul class="mb-0" style="padding-left:20px;">' +
                mensajes.map(function(m) { return '<li>' + m + '</li>'; }).join('') +
                '</ul>';
        }
        new bootstrap.Modal(document.getElementById('errorModal')).show();
    }

    document.addEventListener('DOMContentLoaded', function() {
        var serverError = /*[[${error}]]*/ null;

        if (serverError) {
            mostrarErrorModal(serverError);
        }

        var habitacionId = /*[[${habitacion.id}]]*/ null;
        var precioPorNoche = /*[[${habitacion.precio}]]*/ 0;
        if (!habitacionId) return;

        function actualizarTotal(selectedDates) {
            var totalEl = document.getElementById('totalDisplay');
            var nochesEl = document.getElementById('nochesDisplay');
            if (selectedDates.length === 2) {
                var nights = Math.round((selectedDates[1] - selectedDates[0]) / 86400000);
                var total = precioPorNoche * nights;
                totalEl.textContent = 'S/ ' + total.toFixed(2);
                nochesEl.textContent = nights + ' noche' + (nights > 1 ? 's' : '');
            } else {
                totalEl.textContent = 'S/ 0.00';
                nochesEl.textContent = 'Selecciona las fechas para ver el total';
            }
        }

        function formatearNumeroTarjeta() {
            var input = document.getElementById('numeroTarjeta');
            var valor = input.value.replace(/\D/g, '');
            var partes = [];
            for (var i = 0; i < valor.length; i += 4) {
                partes.push(valor.substring(i, i + 4));
            }
            input.value = partes.join(' ').substring(0, 19);
        }

        document.getElementById('numeroTarjeta').addEventListener('input', formatearNumeroTarjeta);

        document.getElementById('titular').addEventListener('input', function() {
            this.value = this.value.replace(/[^a-zA-ZáéíóúÁÉÍÓÚñÑ\s]/g, '');
        });

        document.getElementById('mesExpiracion').addEventListener('input', function() {
            this.value = this.value.replace(/\D/g, '').substring(0, 2);
        });

        document.getElementById('anioExpiracion').addEventListener('input', function() {
            this.value = this.value.replace(/\D/g, '').substring(0, 4);
        });

        document.getElementById('cvv').addEventListener('input', function() {
            this.value = this.value.replace(/\D/g, '').substring(0, 4);
        });

        document.getElementById('reservaForm').addEventListener('submit', function(e) {
            var submitter = e.submitter;
            var pagarEnHotel = submitter && submitter.value === 'true';

            var fechaInicio = document.getElementById('fechaInicio').value;
            var fechaFin = document.getElementById('fechaFin').value;

            var errores = [];

            if (!fechaInicio || !fechaFin) {
                errores.push('Debe seleccionar las fechas de check-in y check-out.');
            }

            if (!pagarEnHotel) {
                var numTarjeta = document.getElementById('numeroTarjeta').value.replace(/\s/g, '');
                var titular = document.getElementById('titular').value.trim();
                var mes = document.getElementById('mesExpiracion').value;
                var anio = document.getElementById('anioExpiracion').value;
                var cvv = document.getElementById('cvv').value;

                if (!/^\d{16}$/.test(numTarjeta)) {
                    errores.push('El número de tarjeta debe tener 16 dígitos.');
                }

                if (!titular) {
                    errores.push('El nombre del titular es obligatorio.');
                }

                if (!/^(0[1-9]|1[0-2])$/.test(mes)) {
                    errores.push('El mes de expiración debe ser un valor entre 01 y 12.');
                }

                if (!/^\d{4}$/.test(anio)) {
                    errores.push('El año de expiración debe tener 4 dígitos.');
                }

                if (!/^\d{3,4}$/.test(cvv)) {
                    errores.push('El CVV debe tener 3 o 4 dígitos.');
                }
            }

            if (errores.length > 0) {
                e.preventDefault();
                mostrarErrorModal(errores);
                return;
            }

            if (!pagarEnHotel) {
                document.getElementById('numeroTarjeta').value = document.getElementById('numeroTarjeta').value.replace(/\s/g, '');
            }
        });

        fetch('/api/reservas/bloqueadas/' + habitacionId)
            .then(function(r) { return r.json(); })
            .then(function(fechasBloqueadas) {
                var disabledDates = fechasBloqueadas.map(function(f) { return new Date(f + 'T00:00:00'); });

                flatpickr('#rangoFechas', {
                    mode: 'range',
                    dateFormat: 'd/m/Y',
                    minDate: 'today',
                    disable: disabledDates,
                    locale: { rangeSeparator: ' hasta ' },
                    showMonths: 2,
                    animate: true,

                    onDayCreate: function(dObj, dStr, fp, dayElem) {
                        var date = dayElem.dateObj;
                        if (!date) return;
                        var dateStr = flatpickr.formatDate(date, 'Y-m-d');
                        if (fechasBloqueadas.indexOf(dateStr) !== -1) {
                            dayElem.title = 'No disponible';
                            dayElem.style.textDecoration = 'line-through';
                            dayElem.style.color = '#e76f51';
                            dayElem.style.opacity = '0.6';
                        }
                    },

                    onClose: function(selectedDates, dateStr) {
                        actualizarTotal(selectedDates);
                        if (selectedDates.length === 2) {
                            document.getElementById('fechaInicio').value =
                                flatpickr.formatDate(selectedDates[0], 'Y-m-d');
                            document.getElementById('fechaFin').value =
                                flatpickr.formatDate(selectedDates[1], 'Y-m-d');
                        }
                    }
                });
            })
            .catch(function(err) {
                console.error('Error al cargar fechas bloqueadas:', err);
                flatpickr('#rangoFechas', {
                    mode: 'range',
                    dateFormat: 'd/m/Y',
                    minDate: 'today',
                    locale: { rangeSeparator: ' hasta ' },
                    showMonths: 2,
                    onClose: function(selectedDates, dateStr) {
                        actualizarTotal(selectedDates);
                        if (selectedDates.length === 2) {
                            document.getElementById('fechaInicio').value =
                                flatpickr.formatDate(selectedDates[0], 'Y-m-d');
                            document.getElementById('fechaFin').value =
                                flatpickr.formatDate(selectedDates[1], 'Y-m-d');
                        }
                    }
                });
            });
    });
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
